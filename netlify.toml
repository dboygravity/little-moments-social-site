[build]
  publish = "netlify-public"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/profile/1"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/profile/*"
  to = "/profile.html"
  status = 200
